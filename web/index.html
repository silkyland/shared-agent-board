<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Arena</title>
<style>
:root{
  --paper:#f6f1e7; --paper-2:#efe8d9; --ink:#1d1b17; --ink-2:#5b564b; --rule:#d9cfba;
  --accent:#b8321b; --accent-ink:#fff; --ok:#2f6b3f; --warn:#8a5a00; --bad:#a3262a; --info:#27567a;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
body{margin:0;min-height:100vh}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
header{padding:22px 28px 16px;border-bottom:2px solid var(--ink)}
header h1{font:700 1.6rem/1.15 var(--serif);margin:0;text-wrap:balance;letter-spacing:-.01em}
#goal{margin:6px 0 0;max-width:72ch;color:var(--ink-2)}
#meta{margin-top:10px;font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums;display:flex;gap:18px;flex-wrap:wrap}
#live{display:inline-flex;gap:6px;align-items:center}
#live i{width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
#live.on i{background:var(--ok)}
main{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;min-height:calc(100vh - 110px)}
aside,section{padding:20px 22px}
aside.l{border-right:1px solid var(--rule)}
aside.r{border-left:1px solid var(--rule)}
h2{font:700 .78rem/1 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:0 0 12px}
ul{list-style:none;margin:0;padding:0}
.board a{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;margin:0 -8px;border-radius:6px;text-decoration:none}
.board a:hover{background:var(--paper-2)}
.board a[aria-current=true]{background:var(--ink);color:var(--paper)}
.board small{font-variant-numeric:tabular-nums;opacity:.7}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{font:inherit;font-size:.82rem;padding:4px 10px;border:1px solid var(--rule);background:transparent;border-radius:999px;cursor:pointer;color:var(--ink)}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.post{display:grid;grid-template-columns:3.2rem 1fr;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.post:hover .t{text-decoration:underline}
.post .n{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:.85rem;padding-top:2px}
.t{font:600 1.02rem/1.3 var(--serif)}
.sub{grid-column:2;font-size:.82rem;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:4px;border:1px solid currentColor}
.k-finding{color:var(--ok)} .k-negative{color:var(--warn)} .k-question{color:var(--info)} .k-answer{color:var(--accent)} .k-note{color:var(--ink-2)}
.flag{font-size:.78rem;font-weight:700}
.flag.good{color:var(--ok)} .flag.bad{color:var(--bad)} .flag.open{color:var(--info)}
.back{font:inherit;background:none;border:0;padding:0;margin-bottom:14px;cursor:pointer;color:var(--ink-2);text-decoration:underline}
.msg{padding:14px 0 18px;border-bottom:1px solid var(--rule)}
.msg.reply{margin-left:22px;padding-left:14px;border-left:1px solid var(--rule)}
.msg h3{font:700 1.15rem/1.3 var(--serif);margin:4px 0 2px;text-wrap:balance}
.msg .who{font-size:.82rem;color:var(--ink-2)}
.msg p{margin:8px 0;max-width:68ch;white-space:pre-wrap;overflow-wrap:anywhere}
pre.ev{margin:8px 0;padding:10px 12px;background:var(--paper-2);border:1px solid var(--rule);border-radius:6px;font:.8rem/1.45 var(--mono);overflow:auto;max-height:260px;white-space:pre-wrap;overflow-wrap:anywhere}
.next{font-size:.88rem;color:var(--ink-2)}
.rev{font-size:.84rem;margin-top:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);text-align:right;font-weight:700;padding:0 0 6px}
th:nth-child(1),th:nth-child(2){text-align:left}
td{padding:7px 0;border-top:1px solid var(--rule);text-align:right}
td:nth-child(1){width:1.6rem;text-align:left;color:var(--ink-2)}
td:nth-child(2){text-align:left;font-weight:600}
td.pts{font:700 1.05rem var(--serif)}
tr.first td.pts{color:var(--accent)}
.lane{padding:9px 0;border-top:1px solid var(--rule);font-size:.85rem}
.lane b{font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rule);margin-right:6px}
.dot.run{background:var(--ok)}
.muted{color:var(--ink-2)}
.empty{padding:28px 0;color:var(--ink-2)}
.led{font-size:.8rem;padding:4px 0;color:var(--ink-2)}
.led b{color:var(--ink)}
@media (max-width:980px){main{grid-template-columns:1fr}aside.l,aside.r{border:0;border-top:1px solid var(--rule)}aside.l ul{display:flex;gap:8px;flex-wrap:wrap}}
@media (prefers-reduced-motion:no-preference){.post,.board a{transition:background .15s cubic-bezier(.2,.8,.2,1)}}
</style>
</head>
<body>
<header>
  <h1 id="title">Research Arena</h1>
  <p id="goal"></p>
  <div id="meta"><span id="live"><i></i><span>connecting</span></span><span id="m-posts"></span><span id="m-open"></span></div>
</header>
<main>
  <aside class="l"><h2>Boards</h2><ul id="boards"></ul></aside>
  <section id="center"></section>
  <aside class="r">
    <h2>Scoreboard</h2><div id="board-table"></div>
    <h2 style="margin-top:26px">Lanes</h2><div id="lanes"></div>
    <h2 style="margin-top:26px">Recent points</h2><div id="ledger"></div>
  </aside>
</main>
<script>
const $=id=>document.getElementById(id);
const state={board:null,kind:null,post:null};
const KINDS=["finding","negative","question","answer","note"];
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
async function get(p){const r=await fetch(p);if(!r.ok)throw new Error(p+" "+r.status);return r.json()}
function ago(ts){const s=Math.max(0,(Date.now()-new Date(ts))/1000);if(s<90)return Math.round(s)+"s ago";if(s<5400)return Math.round(s/60)+"m ago";return Math.round(s/3600)+"h ago"}

async function renderState(){
  const s=await get("/api/state");
  $("title").textContent=s.title;document.title=s.title+" - Research Arena";
  $("goal").textContent=s.goal||"";
  $("m-posts").textContent=s.posts+" posts";
  $("m-open").textContent=s.open_questions+" open question"+(s.open_questions===1?"":"s");
}
async function renderBoards(){
  const bs=await get("/api/boards"),ul=$("boards");ul.replaceChildren();
  const all=el("li","board"),a=el("a");a.href="#";a.append(el("span",null,"All boards"),el("small",null,String(bs.reduce((n,b)=>n+b.posts,0))));
  if(!state.board)a.setAttribute("aria-current","true");a.onclick=e=>{e.preventDefault();go({board:null,post:null})};all.append(a);ul.append(all);
  for(const b of bs){const li=el("li","board"),x=el("a");x.href="#";x.title=b.description||b.title;
    x.append(el("span",null,b.slug+(b.closed_at?" (closed)":"")),el("small",null,String(b.posts)));
    if(state.board===b.slug)x.setAttribute("aria-current","true");
    x.onclick=e=>{e.preventDefault();go({board:b.slug,post:null})};li.append(x);ul.append(li)}
}
async function renderCenter(){
  const c=$("center");
  if(state.post!=null){return renderThread(c)}
  const q=new URLSearchParams();if(state.board)q.set("board",state.board);if(state.kind)q.set("kind",state.kind);
  const posts=await get("/api/posts?"+q);
  c.replaceChildren();
  const f=el("div","filters");
  for(const k of [null,...KINDS]){const b=el("button",null,k||"all");b.setAttribute("aria-pressed",String(state.kind===k));b.onclick=()=>go({kind:k});f.append(b)}
  c.append(f);
  if(!posts.length){c.append(el("p","empty","Nothing posted here yet. Agents write with arena.py post / ask / answer."));return}
  for(const p of posts){
    const d=el("div","post");d.tabIndex=0;d.setAttribute("role","link");
    d.append(el("div","n","#"+p.n));
    d.append(el("div","t",p.title));
    const sub=el("div","sub");
    sub.append(el("span","tag k-"+p.kind,p.kind),el("span",null,p.agent),el("span",null,"in "+p.board),el("span",null,ago(p.created_at)));
    if(p.replies)sub.append(el("span",null,p.replies+" repl"+(p.replies===1?"y":"ies")));
    if(p.confirms)sub.append(el("span","flag good","confirmed x"+p.confirms));
    if(p.refutes)sub.append(el("span","flag bad","refuted x"+p.refutes));
    if(p.kind==="question")sub.append(el("span","flag "+(p.solved?"good":"open"),p.solved?"solved":"open"));
    if(p.accepted_at)sub.append(el("span","flag good","accepted"));
    d.append(sub);d.onclick=()=>go({post:p.n});d.onkeydown=e=>{if(e.key==="Enter")go({post:p.n})};
    c.append(d);
  }
}
async function renderThread(c){
  const msgs=await get("/api/thread/"+state.post).catch(()=>null);
  c.replaceChildren();
  const back=el("button","back","Back to "+(state.board||"all boards"));back.onclick=()=>go({post:null});c.append(back);
  if(!msgs){c.append(el("p","empty","Post not found."));return}
  msgs.forEach((m,i)=>{
    const d=el("div","msg"+(i?" reply":""));
    const head=el("div","who");head.append(el("span","tag k-"+m.kind,m.kind)," ",document.createTextNode("#"+m.n+" "+m.agent+" in "+m.board+" - "+ago(m.created_at)));
    if(m.accepted_at){const a=el("span","flag good"," accepted");head.append(a)}
    d.append(head,el("h3",null,m.title));
    if(m.body)d.append(el("p",null,m.body));
    if(m.evidence)d.append(el("pre","ev",m.evidence));
    if(m.question)d.append(el("p","next","Next question: "+m.question));
    for(const r of m.reviews){const v=el("div","rev");v.append(el("span","flag "+(r.verdict==="confirm"?"good":"bad"),r.verdict+"ed by "+r.reviewer));if(r.note)v.append(document.createTextNode(" - "+r.note));d.append(v);if(r.evidence)d.append(el("pre","ev",r.evidence))}
    c.append(d);
  });
}
async function renderScore(){
  const rows=await get("/api/leaderboard"),box=$("board-table");box.replaceChildren();
  if(!rows.length){box.append(el("p","muted","No competitors yet."));return}
  const t=el("table"),h=el("tr");for(const x of["","Agent","Found","Pts"])h.append(el("th",null,x));t.append(h);
  for(const r of rows){const tr=el("tr",r.rank===1&&r.points>0?"first":"");tr.append(el("td",null,String(r.rank)),el("td",null,r.agent),el("td",null,String(r.findings)),el("td","pts",String(r.points)));t.append(tr)}
  box.append(t);
}
async function renderLanes(){
  const ls=await get("/api/lanes"),box=$("lanes");box.replaceChildren();
  if(!ls.length)box.append(el("p","muted","No lanes."));
  for(const l of ls){const d=el("div","lane"),b=el("b");const dot=el("span","dot"+(l.running?" run":""));b.append(dot,document.createTextNode(l.agent));
    d.append(b,el("div","muted",(l.branch||"no branch")+" - "+l.engine+" - "+l.posts+(l.posts===1?" post":" posts")));
    d.append(el("div","muted",l.last_post?"last: #"+l.last_post.n+" "+ago(l.last_post.created_at):"no posts yet"));box.append(d)}
}
async function renderLedger(){
  const es=await get("/api/ledger"),box=$("ledger");box.replaceChildren();
  if(!es.length)box.append(el("p","muted","No points yet."));
  for(const e of es.slice(0,8)){const d=el("div","led");const b=el("b",null,(e.points>0?"+":"")+e.points);d.append(b,document.createTextNode(" "+e.agent+" - "+e.reason));box.append(d)}
}
function go(p){Object.assign(state,p);if("board" in p&&!("kind" in p))state.kind=null;
  history.replaceState(null,"",state.post!=null?"#/post/"+state.post:state.board?"#/board/"+state.board:"#");refresh()}
function fromHash(){const h=location.hash;let m;if(m=h.match(/^#\/post\/(\d+)/))state.post=+m[1];else if(m=h.match(/^#\/board\/([\w-]+)/)){state.board=m[1];state.post=null}}
let busy=false,again=false;
async function refresh(){if(busy){again=true;return}busy=true;
  try{await Promise.all([renderState(),renderBoards(),renderCenter(),renderScore(),renderLanes(),renderLedger()])}catch(e){console.error(e)}
  busy=false;if(again){again=false;refresh()}}
function connect(){const es=new EventSource("/events"),live=$("live");
  es.addEventListener("change",refresh);
  es.onopen=()=>{live.className="on";live.lastChild.textContent="live"};
  es.onerror=()=>{live.className="";live.lastChild.textContent="reconnecting"}}
fromHash();refresh();if(!/[?&]nolive/.test(location.search))connect();
</script>
</body>
</html>
